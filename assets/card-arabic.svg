<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img" aria-label="Arabic Text Classification" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
:root{--bg:#fafafa;--fg:#0a0a0a;--mut:#6b6b6b;--line:#cfcfcf;--bar:#0a0a0a;--trk:#e4e4e4}
@media (prefers-color-scheme: dark){:root{--bg:#0a0a0a;--fg:#f5f5f5;--mut:#9a9a9a;--line:#3a3a3a;--bar:#f5f5f5;--trk:#242424}}
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}
.m{font-family:'SFMono-Regular',Consolas,'Courier New',monospace}
.t{font-size:17px;font-weight:700}.s{font-size:11.5px;fill:var(--mut)}
.l{font-size:10.5px;fill:var(--mut)}.v{font-size:11px;font-weight:700}
.bd{fill:none;stroke:var(--fg);stroke-width:1.4;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade{opacity:0;animation:in .8s ease forwards}
@keyframes in{to{opacity:1}}
.bar{fill:var(--bar);transform-box:fill-box;transform-origin:0 50%;animation:grow 8s ease-in-out infinite}
@keyframes grow{0%{transform:scaleX(0)}22%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.pill{fill:none;stroke:var(--line);stroke-width:1}
.tag{font-size:10px;fill:var(--mut)}
.node{fill:none;stroke:var(--fg);stroke-width:1.2}
.pulse{animation:pl 2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.25}50%{opacity:1}}
</style>
<rect x="1" y="1" width="438" height="198" rx="14" fill="var(--bg)"/>
<rect class="bd" pathLength="1" x="1" y="1" width="438" height="198" rx="14"/>
<text class="m l fade" x="28" y="32" style="animation-delay:.3s">02 /</text>
<circle class="pulse" cx="410" cy="28" r="3.5" fill="var(--fg)"/>
<text class="t fade" x="28" y="58" style="animation-delay:.4s">Arabic Text Classification</text>
<text class="s fade" x="28" y="78" style="animation-delay:.5s">5 categories  |  TF-IDF + Logistic Regression</text><text class="m l" x="28" y="108">Accuracy</text><rect x="124" y="102" width="236" height="6" rx="3" fill="var(--trk)"/><rect class="bar" x="124" y="102" width="210.0" height="6" rx="3" style="animation-delay:0.6s"/><text class="m v" x="372" y="109">89%</text><text class="m l" x="28" y="140">5 classes</text><rect class="pulse" x="124" y="132" width="22" height="8" rx="2" fill="var(--fg)" style="animation-delay:0.0s"/><rect class="pulse" x="154" y="132" width="22" height="8" rx="2" fill="var(--fg)" style="animation-delay:0.3s"/><rect class="pulse" x="184" y="132" width="22" height="8" rx="2" fill="var(--fg)" style="animation-delay:0.6s"/><rect class="pulse" x="214" y="132" width="22" height="8" rx="2" fill="var(--fg)" style="animation-delay:0.8999999999999999s"/><rect class="pulse" x="244" y="132" width="22" height="8" rx="2" fill="var(--fg)" style="animation-delay:1.2s"/><rect class="pill" x="28" y="164" width="90" height="20" rx="10"/><text class="tag m" x="36" y="177.5">Scikit-learn</text><rect class="pill" x="126.4" y="164" width="53" height="20" rx="10"/><text class="tag m" x="134.4" y="177.5">TF-IDF</text><rect class="pill" x="187.60000000000002" y="164" width="35" height="20" rx="10"/><text class="tag m" x="195.60000000000002" y="177.5">NLP</text></svg>