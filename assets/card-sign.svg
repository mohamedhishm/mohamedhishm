<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img" aria-label="Sign Language Recognition" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
:root{--bg:#fafafa;--fg:#0a0a0a;--mut:#6b6b6b;--line:#cfcfcf;--bar:#0a0a0a;--trk:#e4e4e4}
@media (prefers-color-scheme: dark){:root{--bg:#0a0a0a;--fg:#f5f5f5;--mut:#9a9a9a;--line:#3a3a3a;--bar:#f5f5f5;--trk:#242424}}
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}
.m{font-family:'SFMono-Regular',Consolas,'Courier New',monospace}
.t{font-size:17px;font-weight:700}.s{font-size:11.5px;fill:var(--mut)}
.l{font-size:10.5px;fill:var(--mut)}.v{font-size:11px;font-weight:700}
.bd{fill:none;stroke:var(--fg);stroke-width:1.4;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade{opacity:0;animation:in .8s ease forwards}
@keyframes in{to{opacity:1}}
.bar{fill:var(--bar);transform-box:fill-box;transform-origin:0 50%;animation:grow 8s ease-in-out infinite}
@keyframes grow{0%{transform:scaleX(0)}22%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.pill{fill:none;stroke:var(--line);stroke-width:1}
.tag{font-size:10px;fill:var(--mut)}
.node{fill:none;stroke:var(--fg);stroke-width:1.2}
.pulse{animation:pl 2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.25}50%{opacity:1}}
</style>
<rect x="1" y="1" width="438" height="198" rx="14" fill="var(--bg)"/>
<rect class="bd" pathLength="1" x="1" y="1" width="438" height="198" rx="14"/>
<text class="m l fade" x="28" y="32" style="animation-delay:.3s">03 /</text>
<circle class="pulse" cx="410" cy="28" r="3.5" fill="var(--fg)"/>
<text class="t fade" x="28" y="58" style="animation-delay:.4s">Sign Language Recognition</text>
<text class="s fade" x="28" y="78" style="animation-delay:.5s">Real-time hand tracking with live Arabic translation</text><line x1="73" y1="118" x2="367" y2="118" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 4"/><rect class="node" x="34" y="104" width="78" height="28" rx="7" fill="var(--bg)"/><text class="m l" x="73" y="122" text-anchor="middle" style="fill:var(--fg)">Camera</text><rect class="node" x="132" y="104" width="78" height="28" rx="7" fill="var(--bg)"/><text class="m l" x="171" y="122" text-anchor="middle" style="fill:var(--fg)">Landmarks</text><rect class="node" x="230" y="104" width="78" height="28" rx="7" fill="var(--bg)"/><text class="m l" x="269" y="122" text-anchor="middle" style="fill:var(--fg)">Classifier</text><rect class="node" x="328" y="104" width="78" height="28" rx="7" fill="var(--bg)"/><text class="m l" x="367" y="122" text-anchor="middle" style="fill:var(--fg)">Arabic</text><circle r="4" cy="118" fill="var(--fg)"><animate attributeName="cx" values="73;367" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/></circle><rect class="pill" x="28" y="164" width="72" height="20" rx="10"/><text class="tag m" x="36" y="177.5">MediaPipe</text><rect class="pill" x="107.80000000000001" y="164" width="53" height="20" rx="10"/><text class="tag m" x="115.80000000000001" y="177.5">OpenCV</text><rect class="pill" x="169.0" y="164" width="28" height="20" rx="10"/><text class="tag m" x="177.0" y="177.5">ML</text></svg>