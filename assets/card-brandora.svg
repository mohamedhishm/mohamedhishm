<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290" role="img" aria-label="Brandora" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>:root{--bg:#fafafa;--fg:#0a0a0a;--mut:#707070;--line:#cfcfcf;--trk:#e4e4e4}
@media (prefers-color-scheme: dark){:root{--bg:#0a0a0a;--fg:#f5f5f5;--mut:#9a9a9a;--line:#333;--trk:#222}}
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}
.m{font-family:'SFMono-Regular',Consolas,'Courier New',monospace}
.mut{fill:var(--mut)}
.bd{fill:none;stroke:var(--fg);stroke-width:1.4;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade{opacity:0;animation:in .8s ease forwards}@keyframes in{to{opacity:1}}
.node{fill:var(--bg);stroke:var(--fg);stroke-width:1.2}
.bar{fill:var(--fg);transform-box:fill-box;transform-origin:0 50%;animation:grow 8s ease-in-out infinite}
@keyframes grow{0%{transform:scaleX(0)}22%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.pulse{animation:pl 2s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.25}50%{opacity:1}}
.pill{fill:none;stroke:var(--line)}
</style>
