<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" role="img" aria-label="Certifications and achievements" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>:root{--bg:#fafafa;--fg:#0a0a0a;--mut:#707070;--line:#cfcfcf;--trk:#e4e4e4}
@media (prefers-color-scheme: dark){:root{--bg:#0a0a0a;--fg:#f5f5f5;--mut:#9a9a9a;--line:#333;--trk:#222}}
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}
.m{font-family:'SFMono-Regular',Consolas,'Courier New',monospace}
.mut{fill:var(--mut)}
.up{animation:up .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.arc{fill:none;stroke:var(--fg);stroke-width:7;stroke-linecap:round;animation:arc 9s ease-in-out infinite}
@keyframes arc{0%,5%{stroke-dasharray:0 400}30%,92%{stroke-dasharray:359 400}96%,100%{stroke-dasharray:0 400}}
.ic{fill:none;stroke:var(--fg);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill{fill:none;stroke:var(--line)}
.pop{animation:pop 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
