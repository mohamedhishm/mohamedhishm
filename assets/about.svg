@keyframes o0{0%,10.33%{opacity:0;transform:translateX(-6px)}12.71%,94%{opacity:1;transform:translateX(0)}94.5%,100%{opacity:0;transform:translateX(0)}}
.c0{animation:c0 21.0s steps(8) infinite}.k0{animation:k0 21.0s linear infinite}.o0{animation:o0 21.0s ease-out infinite}

@keyframes c1{0%,21.90%{transform:translateX(0)}33.05%,94%{transform:translateX(150.1px)}94.01%,100%{transform:translateX(0)}}
