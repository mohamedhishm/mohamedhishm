@keyframes o2{0%,48.62%{opacity:0;transform:translateX(-6px)}51.00%,94%{opacity:1;transform:translateX(0)}94.5%,100%{opacity:0;transform:translateX(0)}}
.c2{animation:c2 21.0s steps(15) infinite}.k2{animation:k2 21.0s linear infinite}.o2{animation:o2 21.0s ease-out infinite}

@keyframes c3{0%,56.19%{transform:translateX(0)}64.48%,94%{transform:translateX(110.6px)}94.01%,100%{transform:translateX(0)}}
@keyframes k3{0%,56.19%{opacity:0}56.20%,64.48%{opacity:1}64.49%,100%{opacity:0}}
@keyframes o3{0%,65.19%{opacity:0;transform:translateX(-6px)}67.57%,94%{opacity:1;transform:translateX(0)}94.5%,100%{opacity:0;transform:translateX(0)}}
.c3{animation:c3 21.0s steps(14) infinite}.k3{animation:k3 21.0s linear infinite}.o3{animation:o3 21.0s ease-out infinite}

@keyframes c4{0%,73.33%{transform:translateX(0)}81.05%,94%{transform:translateX(102.7px)}94.01%,100%{transform:translateX(0)}}
@keyframes k4{0%,73.33%{opacity:0}73.34%,81.05%{opacity:1}81.06%,100%{opacity:0}}
@keyframes o4{0%,81.76%{opacity:0;transform:translateX(-6px)}84.14%,94%{opacity:1;transform:translateX(0)}94.5%,100%{opacity:0;transform:translateX(0)}}
.c4{animation:c4 21.0s steps(13) infinite}.k4{animation:k4 21.0s linear infinite}.o4{animation:o4 21.0s ease-out infinite}
@keyframes lp{0%,86.67%{opacity:0}87.17%,94%{opacity:1}94.5%,100%{opacity:0}}.lp{animation:lp 21.0s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<rect x="1" y="1" width="818" height="343" rx="16" fill="var(--bg)"/>
