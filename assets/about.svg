.c1{animation:c1 21.0s steps(19) infinite}.k1{animation:k1 21.0s linear infinite}.o1{animation:o1 21.0s ease-out infinite}

@keyframes c2{0%,39.05%{transform:translateX(0)}47.90%,94%{transform:translateX(118.5px)}94.01%,100%{transform:translateX(0)}}
