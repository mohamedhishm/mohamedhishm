<svg xmlns="http://www.w3.org/2000/svg" width="820" height="345" viewBox="0 0 820 345" role="img" aria-label="About Maram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
:root{--bg:#fafafa;--fg:#0a0a0a;--mut:#707070;--line:#d0d0d0;--trk:#e4e4e4}
@media (prefers-color-scheme: dark){:root{--bg:#0a0a0a;--fg:#f5f5f5;--mut:#9a9a9a;--line:#333;--trk:#222}}
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}
.m{font-family:'SFMono-Regular',Consolas,'Courier New',monospace;font-size:13px}
.mut{fill:var(--mut)}.sm{font-size:10.5px}
.bd{fill:none;stroke:var(--fg);stroke-width:1.4;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cover{fill:var(--bg)}.cur{fill:var(--fg)}
.ring{fill:none;stroke:var(--fg);stroke-width:6;stroke-linecap:round;animation:arc 21.0s ease-in-out infinite}
@keyframes arc{0%,4%{stroke-dasharray:0 340}22%,94%{stroke-dasharray:301 340}94.5%,100%{stroke-dasharray:0 340}}
.pill{fill:none;stroke:var(--line);stroke-width:1}
.pu{animation:pl 2.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.3}50%{opacity:1}}

@keyframes c0{0%,4.76%{transform:translateX(0)}9.62%,94%{transform:translateX(63.2px)}94.01%,100%{transform:translateX(0)}}
