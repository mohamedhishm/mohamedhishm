<g class="pu" style="animation-delay:0.0s"><rect class="pill" x="548" y="250" width="120" height="22" rx="11"/><text class="m mut" style="font-size:10.5px" x="608" y="265" text-anchor="middle">Machine Learning</text></g><g class="pu" style="animation-delay:0.5s"><rect class="pill" x="676" y="250" width="120" height="22" rx="11"/><text class="m mut" style="font-size:10.5px" x="736" y="265" text-anchor="middle">Deep Learning</text></g><g class="pu" style="animation-delay:1.0s"><rect class="pill" x="548" y="280" width="120" height="22" rx="11"/><text class="m mut" style="font-size:10.5px" x="608" y="295" text-anchor="middle">Computer Vision</text></g><g class="pu" style="animation-delay:1.5s"><rect class="pill" x="676" y="280" width="120" height="22" rx="11"/><text class="m mut" style="font-size:10.5px" x="736" y="295" text-anchor="middle">NLP</text></g>
